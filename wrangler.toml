# Cloudflare Pages: static app from dist/ + the API as Pages Functions (functions/api/[[path]].js).
# Deploy: npm run deploy
#
# Secrets are NOT in this file. The service keys go up from the local .env without pasting (checked first):
#   npm run keys:push        # AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, GEMINI_API_KEY — then `npm run deploy`
# Pasting into wrangler's hidden prompt went wrong three times (invalid, a line break inside, empty). By hand:
#   npx wrangler pages secret put AZURE_SPEECH_KEY
#   npx wrangler pages secret put AZURE_SPEECH_REGION
#   npx wrangler pages secret put GEMINI_API_KEY
#   npx wrangler pages secret put BETA_ACCESS_CODE     # any passphrase you choose; testers enter it in the Parent Zone
name = "wunder-tutor"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"] # Buffer and node:crypto for server/tts.mjs

# Accepted teacher takes, so each phrase is generated (and paid for) once across all devices.
[[kv_namespaces]]
binding = "TTS_CACHE"
id = "138ec3dd03034f40ab92a58125cd6b07"

# Calls to Google leave through a relay outside Hong Kong (the `wunder-egress` Worker, egress/): Google's Gemini service
# refuses requests that leave from Hong Kong ("User location is not supported"), and a Function runs at the Cloudflare
# location nearest the learner — for the launch market, Hong Kong. (Cloudflare's [placement] was tried first,
# 2026-09-20: it is only a hint, and every request entering at HKG still ran at HKG.) Deploy the relay before the app:
#   npm run deploy:egress
[[durable_objects.bindings]]
name = "EGRESS"
class_name = "GoogleEgress"
script_name = "wunder-egress"
